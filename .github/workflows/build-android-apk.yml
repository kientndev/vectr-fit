name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: vectrfit/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        working-directory: vectrfit
        run: npm ci

      - name: Build Next.js Static Web Bundle
        working-directory: vectrfit
        run: npm run build

      - name: Add Capacitor Android Platform & Sync
        working-directory: vectrfit
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: vectrfit/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p release-artifacts
          cp vectrfit/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/VECTR-FIT.apk

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VECTR-FIT-Android-APK
          path: release-artifacts/VECTR-FIT.apk
          retention-days: 14

